<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="stylesheet" href="./styles/main.css" />

    <!-- fuentes -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav id="navbar">
        <section class="img-container">
          <a href="./index.html"><img src="./media/logo.png" alt="Logo Pure Java Solutions" class="img"/></a>
        </section>
        <section class="links-container">
        <a href="./index.html" class="link">Inicio</a>
        <a href="./acerca.html" class="link">Acerca de nosotros</a>
        <a href="./contacto.html" class="link">Contacto</a>
      </section>
      </nav>
    </header>
    <main>
      <section class="container-form">
        <section class="formulario-container">
          <section class="texto">
            <p class="texto-secundario">
              Optimiza tus procesos, escala tu negocio y lidera en la era
              digital.
            </p>
            <h2 class="texto-primario">Agenda una consulta gratuita</h2>
            <p class="texto-secundario">Déjanos tus datos y hablemos.</p>
          </section>
          <form action="" class="formulario">
            <label for="name">Nombre y Apellido</label>
            <input
              type="text"
              name="nombre_usuario"
              id="name"
              placeholder="Escribe tu nombre completo"
              class="entrada"
            />

            <label for="correo">Correo electrónico corporativo</label>
            <input
              type="email"
              name="correo_usuario"
              id="correo"
              placeholder="Tu correo de contacto corporativo"
              class="entrada"
            />

            <label for="telefono">Escríbenos tu número de contaco</label>
            <input
              type="number"
              name="telefono_usuario"
              id="telefono"
              placeholder="Ingresa tu número con lada"
              class="entrada"
            />

            <label for="mensaje">Mensaje</label>
            <input
              type="text"
              name="mensaje_usuario"
              id="mensaje"
              placeholder="Cuéntanos sobre tus necesiades o solicitudes"
              class="entrada largo"
            />

            <button type="submit" class="btn-formulario">
              Solicitar asesoría
            </button>
          </form>
        </section>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
